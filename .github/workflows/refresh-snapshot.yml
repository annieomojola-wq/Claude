# Scheduled snapshot refresh: pulls live closing prices and commits the result,
# so the dashboard's data stays current without anyone running anything locally.
#
# Run it by hand any time from the Actions tab ("Run workflow").

name: Refresh snapshot

on:
  schedule:
    - cron: "30 17 * * 1-5"   # weekdays, 17:30 UTC (after the London close)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch prices
        # stooq first (no API key). If it rate-limits the shared runner IPs and
        # too few companies come back, fall back to Yahoo before giving up.
        run: |
          python3 fetch.py --provider stooq --quiet --fail-under 90 \
            || python3 fetch.py --provider yahoo --quiet --fail-under 90

      - name: Keep the snapshot even if the commit cannot land
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: data/snapshot.json
          retention-days: 14

      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- data/snapshot.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Refresh snapshot ($(date -u +%Y-%m-%d))"
          # The branch may have moved since this run checked out its commit.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
